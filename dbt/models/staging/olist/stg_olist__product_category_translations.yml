version: 2

models:
  - name: stg_olist__product_category_translations
    description: Traduce los nombres de categoría de producto del portugués al inglés.
    columns:
      - name: product_category_name
        description: Primary key. Nombre de categoría de producto en portugués.
        tests:
          - unique
          - not_null
      - name: product_category_name_english
        description: Nombre de categoría de producto traducido al inglés.
        tests:
          - not_null
