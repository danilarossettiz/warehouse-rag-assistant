version: 2

models:
  - name: stg_olist__order_payments
    description: >
      Una fila por transacción de pago aplicada a un pedido. Un pedido
      puede tener múltiples pagos (ej. un voucher más una tarjeta de crédito).
    columns:
      - name: order_id
        description: Foreign key hacia stg_olist__orders.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__orders')
                field: order_id
      - name: payment_sequential
        description: Número secuencial que identifica cada método de pago usado en el pedido, cuando se usó más de uno.
        tests:
          - not_null
      - name: payment_type
        description: Método de pago utilizado.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - credit_card
                  - boleto
                  - voucher
                  - debit_card
                  - not_defined
      - name: payment_installments
        description: Cantidad de cuotas elegidas por el cliente.
        tests:
          - not_null
      - name: payment_value
        description: Valor de esta transacción de pago, en reales brasileños.
        tests:
          - not_null
