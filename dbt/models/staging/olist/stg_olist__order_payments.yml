version: 2

models:
  - name: stg_olist__order_payments
    description: >
      One row per payment transaction applied to an order. An order can have
      multiple payments (e.g. a voucher plus a credit card).
    columns:
      - name: order_id
        description: Foreign key to stg_olist__orders.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__orders')
                field: order_id
      - name: payment_sequential
        description: Sequential number identifying each payment method used for the order, when more than one was used.
        tests:
          - not_null
      - name: payment_type
        description: Payment method used.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - credit_card
                  - boleto
                  - voucher
                  - debit_card
                  - not_defined
      - name: payment_installments
        description: Number of installments chosen by the customer.
        tests:
          - not_null
      - name: payment_value
        description: Value of this payment transaction, in Brazilian reais.
        tests:
          - not_null
