version: 2

models:
  - name: stg_olist__customers
    description: >
      Una fila por id de cliente a nivel pedido. `customer_id` es único por
      pedido, mientras que `customer_unique_id` identifica a la persona real
      a través de múltiples pedidos.
    columns:
      - name: customer_id
        description: Primary key. Identificador de cliente a nivel pedido, referenciado por stg_olist__orders.customer_id.
        tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: Identificador de la persona real, estable a través de múltiples pedidos/customer_id.
        tests:
          - not_null
      - name: customer_zip_code_prefix
        description: Primeros 5 dígitos del código postal del cliente.
        tests:
          - not_null
      - name: customer_city
        description: Ciudad del cliente, tal como se ingresó al momento de la compra.
      - name: customer_state
        description: Estado (provincia) del cliente, como código de 2 letras brasileño.
        tests:
          - not_null
