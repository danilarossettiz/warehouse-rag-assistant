version: 2

models:
  - name: stg_olist__geolocation
    description: >
      Prefijos de código postal brasileños con lat/lng, ciudad y estado
      aproximados. No es único por geolocation_zip_code_prefix — un prefijo
      puede abarcar múltiples puntos lat/lng, así que es una tabla de
      referencia, no una dimensión con clave en el prefijo.
    columns:
      - name: geolocation_zip_code_prefix
        description: Primeros 5 dígitos del código postal.
        tests:
          - not_null
      - name: geolocation_lat
        description: Latitud para este prefijo de código postal.
      - name: geolocation_lng
        description: Longitud para este prefijo de código postal.
      - name: geolocation_city
        description: Nombre de ciudad para este prefijo de código postal.
      - name: geolocation_state
        description: Estado (código de 2 letras brasileño) para este prefijo de código postal.
