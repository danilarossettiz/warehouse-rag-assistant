version: 2

sources:
  - name: olist
    schema: raw
    description: >
      Raw Olist Brazilian e-commerce dataset. Loaded from the CSVs in
      data/raw/ into the RAW schema by scripts/load_to_snowflake.py, which
      infers each table's schema from the CSV headers on every run.
    tables:
      - name: customers
        identifier: customers
        description: One row per order-level customer id.
      - name: geolocation
        identifier: geolocation
        description: Brazilian zip code prefixes with an approximate lat/lng and city/state.
      - name: orders
        identifier: orders
        description: One row per order placed on the Olist marketplace.
      - name: order_items
        identifier: order_items
        description: One row per item (product/seller) within an order.
      - name: order_payments
        identifier: order_payments
        description: One row per payment transaction applied to an order.
      - name: order_reviews
        identifier: order_reviews
        description: One row per customer review left for an order.
      - name: products
        identifier: products
        description: One row per product listed on the marketplace.
      - name: product_category_name_translation
        identifier: product_category_name_translation
        description: Maps Portuguese product category names to their English translation.
      - name: sellers
        identifier: sellers
        description: One row per seller registered on the marketplace.
