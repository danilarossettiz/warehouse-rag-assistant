version: 2

sources:
  - name: olist
    schema: raw
    description: >
      Dataset crudo de e-commerce de Olist (Brasil). Cargado desde los CSV
      en data/raw/ hacia el esquema RAW por scripts/load_to_snowflake.py,
      que infiere el esquema de cada tabla a partir del header del CSV en
      cada corrida.
    tables:
      - name: customers
        identifier: customers
        description: Una fila por id de cliente a nivel pedido.
      - name: geolocation
        identifier: geolocation
        description: Prefijos de código postal brasileños con lat/lng, ciudad y estado aproximados.
      - name: orders
        identifier: orders
        description: Una fila por pedido realizado en el marketplace de Olist.
      - name: order_items
        identifier: order_items
        description: Una fila por item (producto/vendedor) dentro de un pedido.
      - name: order_payments
        identifier: order_payments
        description: Una fila por transacción de pago aplicada a un pedido.
      - name: order_reviews
        identifier: order_reviews
        description: Una fila por reseña de cliente dejada para un pedido.
      - name: products
        identifier: products
        description: Una fila por producto publicado en el marketplace.
      - name: product_category_name_translation
        identifier: product_category_name_translation
        description: Traduce los nombres de categoría de producto del portugués al inglés.
      - name: sellers
        identifier: sellers
        description: Una fila por vendedor registrado en el marketplace.
