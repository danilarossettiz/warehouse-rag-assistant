version: 2

models:
  - name: stg_olist__order_reviews
    description: Una fila por reseña de cliente dejada para un pedido.
    columns:
      - name: review_id
        description: Identificador de la reseña. No es una primary key estricta — el mismo review_id puede aparecer para más de un order_id en los datos crudos.
        tests:
          - not_null
      - name: order_id
        description: Foreign key hacia stg_olist__orders.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__orders')
                field: order_id
      - name: review_score
        description: Puntaje de 1 (peor) a 5 (mejor) otorgado por el cliente.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
      - name: review_comment_title
        description: Título de texto libre de la reseña, en portugués. Frecuentemente nulo.
      - name: review_comment_message
        description: Cuerpo de texto libre de la reseña, en portugués. Frecuentemente nulo.
      - name: review_created_at
        description: Fecha y hora en que se envió la encuesta de reseña al cliente.
        tests:
          - not_null
      - name: review_answered_at
        description: Fecha y hora en que el cliente respondió la encuesta de reseña.
