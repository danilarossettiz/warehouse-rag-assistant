version: 2

models:
  - name: stg_olist__order_reviews
    description: One row per customer review left for an order.
    columns:
      - name: review_id
        description: Identifier of the review. Not a strict primary key — the same review_id can appear for more than one order_id in the raw data.
        tests:
          - not_null
      - name: order_id
        description: Foreign key to stg_olist__orders.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__orders')
                field: order_id
      - name: review_score
        description: Score from 1 (worst) to 5 (best) given by the customer.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
      - name: review_comment_title
        description: Free-text title of the review, in Portuguese. Frequently null.
      - name: review_comment_message
        description: Free-text body of the review, in Portuguese. Frequently null.
      - name: review_created_at
        description: Timestamp when the review survey was sent to the customer.
        tests:
          - not_null
      - name: review_answered_at
        description: Timestamp when the customer answered the review survey.
