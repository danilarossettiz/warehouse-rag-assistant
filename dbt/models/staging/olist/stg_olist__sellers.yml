version: 2

models:
  - name: stg_olist__sellers
    description: Una fila por vendedor registrado en el marketplace.
    columns:
      - name: seller_id
        description: Primary key. Identificador único del vendedor.
        tests:
          - unique
          - not_null
      - name: seller_zip_code_prefix
        description: Primeros 5 dígitos del código postal del vendedor.
        tests:
          - not_null
      - name: seller_city
        description: Nombre de ciudad del vendedor.
      - name: seller_state
        description: Estado (provincia) del vendedor, como código de 2 letras brasileño.
        tests:
          - not_null
