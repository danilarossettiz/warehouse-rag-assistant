version: 2

models:
  - name: stg_olist__orders
    description: Una fila por pedido realizado en el marketplace de Olist.
    columns:
      - name: order_id
        description: Primary key. Identificador único del pedido.
        tests:
          - unique
          - not_null
      - name: customer_id
        description: Identificador de cliente a nivel pedido.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__customers')
                field: customer_id
      - name: order_status
        description: Estado (status) actual del pedido.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - delivered
                  - shipped
                  - canceled
                  - unavailable
                  - invoiced
                  - processing
                  - created
                  - approved
      - name: order_purchase_at
        description: Fecha y hora en que el cliente realizó el pedido.
        tests:
          - not_null
      - name: order_approved_at
        description: Fecha y hora en que se aprobó el pago del pedido.
      - name: order_delivered_carrier_at
        description: Fecha y hora en que el pedido fue entregado al transportista.
      - name: order_delivered_customer_at
        description: Fecha y hora en que el pedido fue entregado al cliente.
      - name: order_estimated_delivery_at
        description: Fecha estimada de entrega mostrada al cliente al momento de la compra.
