version: 2

models:
  - name: stg_olist__order_items
    description: One row per item (product/seller) within an order.
    columns:
      - name: order_id
        description: Foreign key to stg_olist__orders.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__orders')
                field: order_id
      - name: order_item_id
        description: Sequential number of the item within the order, starting at 1.
        tests:
          - not_null
      - name: product_id
        description: Foreign key to stg_olist__products.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__products')
                field: product_id
      - name: seller_id
        description: Foreign key to stg_olist__sellers.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__sellers')
                field: seller_id
      - name: shipping_limit_at
        description: Deadline for the seller to hand the item to the logistics carrier.
      - name: price
        description: Item price, in Brazilian reais, excluding freight.
        tests:
          - not_null
      - name: freight_value
        description: Freight cost for this item, in Brazilian reais.
        tests:
          - not_null
