version: 2

models:
  - name: stg_olist__order_items
    description: Una fila por item (producto/vendedor) dentro de un pedido.
    columns:
      - name: order_id
        description: Foreign key hacia stg_olist__orders.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__orders')
                field: order_id
      - name: order_item_id
        description: Número secuencial del item dentro del pedido, empezando en 1.
        tests:
          - not_null
      - name: product_id
        description: Foreign key hacia stg_olist__products.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__products')
                field: product_id
      - name: seller_id
        description: Foreign key hacia stg_olist__sellers.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__sellers')
                field: seller_id
      - name: shipping_limit_at
        description: Fecha límite para que el vendedor entregue el item al transportista.
      - name: price
        description: Precio del item, en reales brasileños, sin flete.
        tests:
          - not_null
      - name: freight_value
        description: Costo de flete para este item, en reales brasileños.
        tests:
          - not_null
