version: 2

models:
  - name: stg_olist__products
    description: >
      Una fila por producto publicado en el marketplace. `product_name_length`
      y `product_description_length` se renombraron desde las columnas
      `_lenght` (mal escritas) de la fuente.
    columns:
      - name: product_id
        description: Primary key. Identificador único del producto.
        tests:
          - unique
          - not_null
      - name: product_category_name
        description: >
          Categoría del producto, en portugués. Foreign key hacia
          stg_olist__product_category_translations. Puede ser nulo para
          productos que nunca fueron categorizados. Dos categorías
          ("pc_gamer" y "portateis_cozinha_e_preparadores_de_alimentos")
          no tienen fila correspondiente en la tabla de traducción — un gap
          conocido en los datos fuente — por eso el test de relationships
          está en warn y no falla el build.
        tests:
          - relationships:
              arguments:
                to: ref('stg_olist__product_category_translations')
                field: product_category_name
              config:
                severity: warn
      - name: product_name_length
        description: Cantidad de caracteres en el nombre del producto.
      - name: product_description_length
        description: Cantidad de caracteres en la descripción del producto.
      - name: product_photos_qty
        description: Cantidad de fotos publicadas para el producto.
      - name: product_weight_g
        description: Peso del producto, en gramos.
      - name: product_length_cm
        description: Largo del producto, en centímetros.
      - name: product_height_cm
        description: Alto del producto, en centímetros.
      - name: product_width_cm
        description: Ancho del producto, en centímetros.
